name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: lan-drop-x86_64-windows.zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: lan-drop-x86_64-macos.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: lan-drop-aarch64-macos.tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: lan-drop-x86_64-linux.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ matrix.target }}-cargo-

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/lan-drop.exe dist/
          cp -r frontend dist/frontend
          cp README.md LICENSE dist/
          cd dist && 7z a ../${{ matrix.artifact }} .

      - name: Package (macOS/Linux)
        if: matrix.target != 'x86_64-pc-windows-msvc'
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/lan-drop dist/
          cp -r frontend dist/frontend
          cp README.md LICENSE dist/
          cd dist && tar czf ../${{ matrix.artifact }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/**/*
