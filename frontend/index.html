<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LanDrop</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <div id="app">
    <header>
      <h1>LanDrop</h1>
      <div id="header-actions">
        <div id="self-info"></div>
        <button id="qr-btn" class="btn-icon" title="二维码" aria-label="显示访问二维码">&#x1F4F1;</button>
      </div>
    </header>

    <main>
      <section id="peers-section">
        <h2>在线设备</h2>
        <div id="peers-list"></div>
        <p id="no-peers" class="hint">等待其他设备连接…<br><span class="hint-tip">点右上角 📱 生成二维码，其他设备扫码即可加入</span></p>
      </section>

      <section id="transfer-section">
        <div class="section-header">
          <h2>传输</h2>
          <select id="speed-limit" class="speed-select">
            <option value="0">不限速</option>
            <option value="1048576">1 MB/s</option>
            <option value="5242880">5 MB/s</option>
            <option value="10485760">10 MB/s</option>
          </select>
        </div>
        <div id="transfers-list"></div>
        <p id="no-transfers" class="hint">暂无传输任务</p>
        <div id="history-section" class="history-section">
          <h3 class="history-title">最近传输</h3>
          <div id="history-list"></div>
        </div>
      </section>

      <section id="messages-section">
        <h2>消息</h2>
        <div id="messages-list"></div>
        <p id="no-messages" class="hint">暂无消息</p>
      </section>

      <section id="chat-section">
        <h2>群聊</h2>
        <div id="chat-messages"></div>
        <div id="chat-input-bar">
          <input type="text" id="chat-input" placeholder="发送群聊消息... (Enter 发送)" maxlength="4096">
          <button id="chat-send" class="btn btn-primary btn-sm">发送</button>
        </div>
      </section>
    </main>

    <!-- File offer dialog -->
    <dialog id="offer-dialog" class="dialog">
      <div class="dialog-content">
        <h3 id="offer-title">接收文件</h3>
        <p id="offer-file-info"></p>
        <div class="dialog-actions">
          <button id="offer-reject" class="btn btn-secondary">拒绝</button>
          <button id="offer-accept" class="btn btn-primary">接收</button>
        </div>
      </div>
    </dialog>

    <!-- Text compose dialog -->
    <dialog id="text-compose-dialog" class="dialog">
      <div class="dialog-content">
        <h3 id="text-compose-title">发送文本</h3>
        <label class="secure-toggle">
          <input type="checkbox" id="text-compose-secure">
          <span class="secure-toggle-label">安全传输 (E2E)</span>
          <span class="secure-toggle-hint" id="secure-hint"></span>
        </label>
        <textarea id="text-compose-input" placeholder="输入文本、链接...&#10;Ctrl+Enter 发送" rows="5"></textarea>
        <div class="dialog-actions">
          <button id="text-compose-cancel" class="btn btn-secondary">取消</button>
          <button id="text-compose-send" class="btn btn-primary">发送</button>
        </div>
      </div>
    </dialog>

    <!-- Text receive dialog -->
    <dialog id="text-receive-dialog" class="dialog">
      <div class="dialog-content">
        <h3 id="text-receive-title">收到文本</h3>
        <pre id="text-receive-content"></pre>
        <div class="dialog-actions">
          <button id="text-receive-close" class="btn btn-secondary">关闭</button>
          <button id="text-receive-copy" class="btn btn-primary">复制</button>
        </div>
      </div>
    </dialog>

    <!-- QR code dialog -->
    <dialog id="qr-dialog" class="dialog">
      <div class="dialog-content">
        <h3>扫码访问</h3>
        <div id="qr-container"></div>
        <p id="qr-url"></p>
        <div class="dialog-actions">
          <button id="qr-copy" class="btn btn-secondary">复制链接</button>
          <button id="qr-close" class="btn btn-primary">关闭</button>
        </div>
      </div>
    </dialog>

    <!-- Media preview dialog -->
    <dialog id="preview-dialog" class="dialog">
      <div class="dialog-content preview-dialog-content">
        <div id="preview-media-container"></div>
        <div class="dialog-actions">
          <button id="preview-download" class="btn btn-secondary">下载</button>
          <button id="preview-close" class="btn btn-primary">关闭</button>
        </div>
      </div>
    </dialog>
  </div>

  <script src="lib/qrcode.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
